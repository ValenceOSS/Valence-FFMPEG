on:
  workflow_call:
    inputs:
      distro:
        required: true
        default: 'debian'
        type: string
      codenames:
        description: 'Stringified JSON object listing target distro codenames'
        required: true
        default: '["trixie"]'
        type: string
      architectures:
        description: 'Stringified JSON object listing target architectures'
        required: true
        default: '["amd64"]'
        type: string
      release:
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: 'Build FFmpeg'
    runs-on: ubuntu-latest
    strategy:
      # Each of these takes around two and a half hours and none of them depends
      # on another. Cancelling the rest when one fails only ever saved build
      # minutes, and on a public repository there are none to save — so the
      # trade was three finished builds for a few minutes of a runner.
      #
      # It was not hypothetical: two release attempts each lost one job to a
      # download from somebody else's server, and each took the other three
      # healthy builds down with it.
      fail-fast: false
      matrix:
        release: ${{fromJson(inputs.codenames)}}
        arch: ${{fromJson(inputs.architectures)}}
  
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install make and mmv
        run: sudo apt-get install make mmv

      # Sources the build fetches, kept between runs.
      #
      # Retries alone never solved this. Each of the four jobs was fetching all
      # thirty-five dependencies from scratch, twenty-seven of them from
      # github.com, so a run meant a burst of well over a hundred requests from
      # one unauthenticated runner pool. That is what gets throttled, and the
      # AMF tarball proved patience does not help: it failed after three tries.
      #
      # `restore-keys` is safe here rather than merely convenient. Entries are
      # keyed by URL *and* ref inside the cache, so an older cache cannot serve
      # a tree for a pin that has since moved — it simply misses and refetches.
      #
      # Keyed by arch because the arm and amd paths fetch different sets. The
      # two releases of the same arch share, and whichever finishes second is
      # refused the save with a warning, which costs nothing.
      - name: Cache fetched sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sources
          key: sources-${{ matrix.arch }}-${{ hashFiles('docker-build.sh') }}
          restore-keys: |
            sources-${{ matrix.arch }}-

      - name: Build Linux
        run: ./build ${{ matrix.release }} ${{ matrix.arch }} dist

      # The build writes into the mount as root. Without this the cache save
      # cannot read what it is meant to store, and fails at the end of a job
      # that otherwise succeeded.
      - name: Make the source cache readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .sources

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distro }}-${{ matrix.release }}-${{ matrix.arch }}
          path: dist

  publish:
    name: Publish Release
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      # One asset failing to upload is no reason to abandon the others: three
      # attached debs are more use than none, and the missing one can be
      # uploaded to the same release afterwards.
      fail-fast: false
      matrix:
        release: ${{fromJson(inputs.codenames)}}
        arch: ${{fromJson(inputs.architectures)}}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.distro }}-${{ matrix.release }}-${{ matrix.arch }}
          path: artifact

      - name: Upload GH Release Assets
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # v1.10.4
        with:
          upload_url: ${{ github.event.release.upload_url }}
          overwrite: true
          asset_path: |
            ./artifact/**/*.deb

