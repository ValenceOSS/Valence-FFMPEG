on:
  workflow_call:
    inputs:
      release:
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: 'Build Portable FFmpeg (win64)'
    # Upstream's clang build, the one jellyfin-ffmpeg published for Windows, put back for the
    # Windows half of VAL-338. Inside Docker Desktop a Windows PC reaches NVIDIA's encoder and
    # nothing of Intel's or AMD's, so Valence's transcoder runs natively there, and a native install
    # needs a build -- the same reason the Mac targets exist.
    #
    # Built with msys2's clang toolchain on a Windows runner rather than cross-compiled from Linux.
    # Upstream kept both and disabled the cross build once this one was stable; this one is static,
    # so the artefact is ffmpeg.exe and ffprobe.exe and nothing beside them.
    #
    # win64 only. Upstream also built Windows on Arm, which Valence ships no transcoder for.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            git
            curl
            wget
            zip
            mingw-w64-clang-x86_64-toolchain
            quilt
            diffstat
            mingw-w64-clang-x86_64-nasm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FFBUILD_PREFIX in msys2/build.sh. Every dependency installs here.
      - name: Prepare prefix dir
        run: mkdir /clang64/ffbuild

      - name: Build Portable
        run: ./msys2/build.sh

      # Proves the build has what Valence's Windows pipelines name, rather than trusting that a
      # green build meant every library was found. configure drops a library it cannot find
      # without failing, and a build without libvpl still produces a working ffmpeg -- one with no
      # QuickSync, which is the whole of what an Intel machine runs this for.
      #
      # Presence only. The runner has no GPU, so whether a filter runs on a given card is the
      # transcoder's own startup check to answer, on that card.
      - name: Verify the hardware filters and encoders are in the build
        run: |
          set -euo pipefail
          cd msys2/artifacts
          unzip -o -q ./*.zip
          ./ffmpeg.exe -hide_banner -version | head -1
          ./ffmpeg.exe -hide_banner -version | head -1 | grep -q Valence
          # A native Windows program ends its lines in CRLF, which would defeat every match below.
          filters="$(./ffmpeg.exe -hide_banner -filters | tr -d '\r')"
          encoders="$(./ffmpeg.exe -hide_banner -encoders | tr -d '\r')"
          hwaccels="$(./ffmpeg.exe -hide_banner -hwaccels | tr -d '\r')"
          missing=0
          for filter in vpp_qsv overlay_qsv vpp_amf scale_cuda tonemap_cuda overlay_cuda scale_d3d11 subtitles zscale libplacebo; do
              if grep -qE "^ *[TSC.]+ +${filter} " <<< "$filters"; then
                  echo "filter present: ${filter}"
              else
                  echo "filter MISSING: ${filter}"
                  missing=1
              fi
          done
          for encoder in h264_qsv hevc_qsv av1_qsv h264_amf hevc_amf av1_amf h264_nvenc hevc_nvenc av1_nvenc libx264 libx265 libsvtav1; do
              if grep -qE "^ *[A-Z.]+ +${encoder} " <<< "$encoders"; then
                  echo "encoder present: ${encoder}"
              else
                  echo "encoder MISSING: ${encoder}"
                  missing=1
              fi
          done
          for hwaccel in d3d11va qsv cuda; do
              if grep -qx "${hwaccel}" <<< "$hwaccels"; then
                  echo "hwaccel present: ${hwaccel}"
              else
                  echo "hwaccel MISSING: ${hwaccel}"
                  missing=1
              fi
          done
          rm -f ffmpeg.exe ffprobe.exe
          exit "$missing"

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win64-portable
          path: ./msys2/artifacts

  publish:
    name: Publish Portable Release
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win64-portable
          path: artifact

      - name: Upload GH Release Assets
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # v1.10.4
        with:
          upload_url: ${{ github.event.release.upload_url }}
          overwrite: true
          asset_path: |
            ./artifact/**/*.zip
