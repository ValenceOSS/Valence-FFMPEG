name: '🏗️ Build valence-ffmpeg'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# `valence` carries Valence's patches on top of FFmpeg, the way upstream used a branch
# named `jellyfin` for theirs. Named for what it holds rather than `main`, which
# would have read as though it were FFmpeg's own trunk.
on:
  push:
    branches:
      - valence
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - valence
    paths-ignore:
      - '**/*.md'

# Debian and macOS. Upstream also builds Ubuntu and Windows; Valence consumes
# neither, and both are build minutes spent on nothing.
#
# macOS is here for a reason the container image cannot cover. VideoToolbox
# cannot be passed into a container on a Mac -- Docker Desktop runs a Linux VM
# and so does Apple's own `container` framework, so anything containerised
# transcodes in software whatever the hardware underneath. A Mac that wants its
# own encoder has to install natively, and a native install needs a build.
jobs:
  build_debian:
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'debian'
      codenames: '["bookworm", "trixie"]'
      architectures: '["amd64", "arm64"]'
      release: false

  build_macos:
    uses: ./.github/workflows/_meta_mac.yaml
    with:
      release: false
