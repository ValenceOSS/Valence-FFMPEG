name: '🏗️ Build valence-ffmpeg'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# `valence` carries Valence's patches on top of FFmpeg, the way upstream used a branch
# named `jellyfin` for theirs. Named for what it holds rather than `main`, which
# would have read as though it were FFmpeg's own trunk.
on:
  push:
    branches:
      - valence
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - valence
    paths-ignore:
      - '**/*.md'

# Debian, macOS and Windows. Upstream also builds Ubuntu, which Valence does not
# consume, and those are build minutes spent on nothing.
#
# macOS is here for a reason the container image cannot cover. VideoToolbox
# cannot be passed into a container on a Mac -- Docker Desktop runs a Linux VM
# and so does Apple's own `container` framework, so anything containerised
# transcodes in software whatever the hardware underneath. A Mac that wants its
# own encoder has to install natively, and a native install needs a build.
jobs:
  build_debian:
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'debian'
      codenames: '["bookworm", "trixie"]'
      architectures: '["amd64", "arm64"]'
      release: false

  build_macos:
    uses: ./.github/workflows/_meta_mac.yaml
    with:
      release: false

  # Windows for the same reason as macOS, one step removed. Docker Desktop on
  # Windows passes NVIDIA's encoder into a container and nothing of Intel's or
  # AMD's, so a Windows PC that wants QuickSync or AMF has to run Valence's
  # transcoder natively, and a native install needs a build. See VAL-338.
  # Both x64 and Windows on Arm, whose Qualcomm GPU only a native build can
  # reach through Media Foundation. See VAL-355.
  build_windows:
    uses: ./.github/workflows/_meta_windows.yaml
    with:
      release: false
