on:
  workflow_call:
    inputs:
      release:
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: 'Build Portable FFmpeg (${{ matrix.target }})'
    # Both Mac targets, from one arm64 runner. Upstream did the same: the Intel
    # build is cross-compiled rather than needing an Intel machine, and
    # variants/defaults-mac.sh already carries the whole of that path -- it
    # reads the builder's own architecture, and on an arm64 builder making a
    # mac64 target it adds `-arch x86_64`, `--enable-cross-compile --arch=x86_64`
    # and CMAKE_OSX_ARCHITECTURES, with a meson cross file beside it.
    #
    # This built Apple silicon alone until now, because an Intel artefact nobody
    # had run would ship unexercised at exactly the machine most likely to
    # receive it -- an Intel Mac mini is a common thing to retire into a media
    # server. That is still true of the *artefact*, which is why the Intel one
    # is built and checked here but is not evidence on its own: what the runner
    # can prove is that it compiled and that it is Intel, and a real Intel Mac
    # has to prove the filters run. See VAL-110.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macarm64
            arch: arm64
          - target: mac64
            arch: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build wants Homebrew for its toolchain, and images/macos/00-dep.sh
      # installs the rest. That script is why this job exists on a runner rather
      # than on a developer's machine: it uninstalls Homebrew's cmake, and the
      # builder's own README notes it strips every libx11-linked package to keep
      # the binary portable. Neither is a thing to do to a machine somebody uses.
      #
      # Pinned by commit like every other action here, rather than tracking
      # `master` the way upstream did. Homebrew deprecated that: the branch sync
      # stops and the warning becomes an error at Homebrew 5.2.0, which was due
      # no earlier than June and so can land at any time -- including during a
      # release build.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # FFBUILD_PREFIX in buildmac.sh. Every dependency installs here, so it has
      # to exist and be writable before the first one builds.
      - name: Prepare prefix dir
        run: |
          sudo mkdir -p /opt/ffbuild
          sudo chmod 777 /opt/ffbuild

      # buildmac.sh is told `arm64` rather than left to read `uname -m`, so that
      # the target is a decision here and not a property of whichever machine
      # GitHub happened to allocate. That makes the runner's architecture an
      # assumption, and an assumption worth failing on in a second rather than
      # two hours in: asking for arm64 on an Intel host selects the macarm64
      # target without any of the cross-compile flags.
      - name: Check the runner is Apple silicon
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "runner architecture: ${arch}"
          [[ "${arch}" == "arm64" ]]

      - name: Build Portable
        run: ./builder/buildmac.sh ${{ matrix.arch }}

      # Proves the point of the target rather than trusting that a green build
      # meant the patches applied. A quilt step that applies nothing still
      # produces a working ffmpeg -- just a stock one -- so the build going
      # green is not evidence of the thing this target is for.
      #
      # These three and only these three, because each is registered in
      # allfilters.c by a patch rather than existing upstream: overlay by 0044,
      # tonemap by 0046, bwdif by 0056. So none of them can be present unless
      # the series applied.
      #
      # scale_vt, transpose_vt and yadif_videotoolbox are deliberately absent
      # from the list. All three are upstream -- 0045 replaces transpose_vt's
      # implementation without registering it -- so Homebrew's build has them
      # too and they would pass whether or not a patch applied.
      # The cross-compiled binary cannot be run here. It is x86_64 and the runner
      # is arm64, and Rosetta is not something to depend on being installed on a
      # CI image. So the architecture is asserted instead, which is the half of
      # this that a runner can answer: a build that silently came out arm64
      # under the mac64 name is the failure worth catching, and it is exactly
      # what would happen if the cross-compile branch in defaults-mac.sh ever
      # stopped firing.
      - name: Verify the build is for the target it claims
        run: |
          set -euo pipefail
          archs="$(lipo -archs ./builder/ffmpeg)"
          echo "built for: ${archs}"
          case "${{ matrix.target }}" in
              macarm64) [[ "${archs}" == *arm64* ]] ;;
              mac64)    [[ "${archs}" == *x86_64* ]] ;;
          esac

      # Proves the point of the target rather than trusting that a green build
      # meant the patches applied. A quilt step that applies nothing still
      # produces a working ffmpeg -- just a stock one -- so the build going
      # green is not evidence of the thing this target is for.
      #
      # These three and only these three, because each is registered in
      # allfilters.c by a patch rather than existing upstream: overlay by 0044,
      # tonemap by 0046, bwdif by 0056. So none of them can be present unless
      # the series applied.
      #
      # scale_vt, transpose_vt and yadif_videotoolbox are deliberately absent
      # from the list. All three are upstream -- 0045 replaces transpose_vt's
      # implementation without registering it -- so Homebrew's build has them
      # too and they would pass whether or not a patch applied.
      #
      # Only for the native target. The patch series is one series and applies
      # to both, so proving it on the build that can be run here proves it for
      # the other -- what the Intel build still owes is that the filters *run*
      # on Intel hardware, which no runner can answer and a real Mac must.
      - name: Verify the VideoToolbox filters are in the build
        if: matrix.target == 'macarm64'
        run: |
          set -euo pipefail
          ./builder/ffmpeg -hide_banner -version
          filters="$(./builder/ffmpeg -hide_banner -filters)"
          missing=0
          for filter in overlay_videotoolbox tonemap_videotoolbox bwdif_videotoolbox; do
              if grep -qE "^ *[TSC.]+ +${filter} " <<< "$filters"; then
                  echo "present: ${filter}"
              else
                  echo "MISSING: ${filter}"
                  missing=1
              fi
          done
          exit "$missing"

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}-portable
          path: ./builder/artifacts

  publish:
    name: Publish Portable Release
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      # Both targets, merged into one directory. `pattern` with `merge-multiple`
      # rather than naming one artifact, so a target added to the matrix is
      # published without a second change here.
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mac*-portable
          merge-multiple: true
          path: artifact

      # Upstream also pushed these to repo.jellyfin.org over ssh. Same reasoning
      # as the Debian path: the tarball is attached to the GitHub release, which
      # is where a Mac fetches it from and needs no credentials.
      - name: Upload GH Release Assets
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # v1.10.4
        with:
          upload_url: ${{ github.event.release.upload_url }}
          overwrite: true
          asset_path: |
            ./artifact/**/*.tar.xz
