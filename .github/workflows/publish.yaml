name: '🚀 Build and Publish valence-ffmpeg'

on:
  release:
    types:
      - released
      - prereleased

# Upstream also pushed the built packages into repo.jellyfin.org over ssh. Those
# steps and the three secrets they needed are gone: the packages are attached to
# the GitHub release instead, which is what Valence's Dockerfile installs from and
# needs no credentials at all.
jobs:
  build_publish_debian:
    # Attaching an asset to the release is a write to repository contents, and
    # the default token is read-only unless a workflow asks. Granted here on the
    # caller, which the called workflow's jobs then inherit.
    permissions:
      contents: write
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'debian'
      codenames: '["bookworm", "trixie"]'
      architectures: '["amd64", "arm64"]'
      release: true

  # Both Mac architectures, and a portable tarball rather than a package. The two
  # binaries are static, so installing is an untar and a path; neither a signed
  # .pkg nor a Homebrew tap buys enough over that to be worth a Developer ID
  # certificate or a second repository to hold a formula.
  build_publish_macos:
    permissions:
      contents: write
    uses: ./.github/workflows/_meta_mac.yaml
    with:
      release: true
